# GPU NVIDIA pour Ollama (postes équipés d'une carte NVIDIA + Docker Desktop/WSL2 ou nvidia-container-toolkit).
# Usage : docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ollama
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
